# Construit l'installateur Windows de La Carte et le publie dans GitHub Releases.
# Se déclenche quand une étiquette de version (ex. v1.1.0) est poussée.
# Les logiciels déjà installés détectent alors la mise à jour au démarrage.
name: Publier une version

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire l'interface React
        run: npm run build
        env:
          CI: false

      - name: Construire et publier l'installateur Windows
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
